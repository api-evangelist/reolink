aid: reolink
name: Reolink
description: >-
  Reolink is a provider of security cameras and smart home surveillance technology. Their cameras offer an HTTP API that
  enables direct device control and configuration through JSON-based POST requests. The API supports comprehensive
  camera management including PTZ control, video encoding settings, recording search and playback, motion and AI-powered
  object detection, network configuration, LED control, and user authentication. The API is accessible on the local
  network via the device IP address.
type: Index
accessModel:
