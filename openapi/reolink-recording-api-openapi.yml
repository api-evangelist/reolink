openapi: 3.0.3
info:
  title: Reolink Camera HTTP AI Recording API
  description: The Reolink Camera HTTP API provides a RESTful interface for controlling and configuring Reolink IP cameras and NVRs. All commands are sent as HTTP POST requests to the /cgi-bin/api.cgi endpoint with JSON payloads. The API supports authentication via token-based sessions, device information retrieval, network configuration, video and image settings, encoding parameters, recording management, PTZ (pan-tilt-zoom) control, alarm and motion detection configuration, IR and LED light control, AI-powered object detection, and live streaming URL generation. Authentication is performed by first calling the Login command to obtain a session token, which is then passed as a query parameter on subsequent requests.
  version: '8.0'
  contact:
    name: Reolink
    url: https://reolink.com
  license:
    name: Proprietary
    url: https://reolink.com
servers:
- url: https://{camera_ip}
  description: Reolink Camera or NVR
  variables:
    camera_ip:
      default: 192.168.1.100
      description: IP address of the Reolink camera or NVR
security:
- tokenAuth: []
tags:
- name: Recording
  description: Recording schedules, search, and playback
paths:
  /cgi-bin/api.cgi?cmd=GetRec&token={token}:
    post:
      operationId: getRec
      summary: Get recording settings
      description: Retrieves recording schedule and configuration parameters.
      tags:
      - Recording
      parameters:
      - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRequest'
      responses:
        '200':
          description: Recording settings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
  /cgi-bin/api.cgi?cmd=SetRec&token={token}:
    post:
      operationId: setRec
      summary: Set recording settings
      description: Configures recording schedule and parameters.
      tags:
      - Recording
      parameters:
      - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          description: Recording settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
  /cgi-bin/api.cgi?cmd=Search&token={token}:
    post:
      operationId: searchRecordings
      summary: Search recordings
      description: Searches for recordings by date, time range, and channel.
      tags:
      - Recording
      parameters:
      - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
components:
  schemas:
    SearchResponse:
      type: object
      properties:
        cmd:
          type: string
        code:
          type: integer
        value:
          type: object
          properties:
            SearchResult:
              type: object
              properties:
                channel:
                  type: integer
                Status:
                  type: array
                  items:
                    type: object
                    properties:
                      year:
                        type: integer
                      mon:
                        type: integer
                      table:
                        type: string
                        description: Bitmask of days with recordings
    CommandRequest:
      type: object
      required:
      - cmd
      - action
      properties:
        cmd:
          type: string
          description: The API command name
        action:
          type: integer
          description: Action type (0 for get, 1 for set)
        param:
          type: object
          description: Command-specific parameters
    CommandResponse:
      type: object
      properties:
        cmd:
          type: string
          description: The command that was executed
        code:
          type: integer
          description: Response code (0 for success)
        value:
          type: object
          description: Command-specific response data
        error:
          type: object
          properties:
            rspCode:
              type: integer
              description: Error response code
            detail:
              type: string
              description: Error detail message
    ChannelRequest:
      type: object
      required:
      - cmd
      - action
      - param
      properties:
        cmd:
          type: string
          description: The API command name
        action:
          type: integer
          description: Action type (0 for get)
        param:
          type: object
          required:
          - channel
          properties:
            channel:
              type: integer
              description: Camera channel number (starting from 0)
    SearchRequest:
      type: object
      required:
      - cmd
      - action
      - param
      properties:
        cmd:
          type: string
          enum:
          - Search
        action:
          type: integer
          enum:
          - 0
        param:
          type: object
          required:
          - Search
          properties:
            Search:
              type: object
              required:
              - channel
              - onlyStatus
              - streamType
              - StartTime
              - EndTime
              properties:
                channel:
                  type: integer
                onlyStatus:
                  type: integer
                  description: 0 for full results, 1 for status only
                streamType:
                  type: string
                  enum:
                  - main
                  - sub
                StartTime:
                  type: object
                  properties:
                    year:
                      type: integer
                    mon:
                      type: integer
                    day:
                      type: integer
                    hour:
                      type: integer
                    min:
                      type: integer
                    sec:
                      type: integer
                EndTime:
                  type: object
                  properties:
                    year:
                      type: integer
                    mon:
                      type: integer
                    day:
                      type: integer
                    hour:
                      type: integer
                    min:
                      type: integer
                    sec:
                      type: integer
  parameters:
    Token:
      name: token
      in: path
      required: true
      description: Authentication token obtained from the Login command
      schema:
        type: string
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: query
      name: token
      description: Authentication token obtained from the Login command. Pass as a query parameter on all requests after authentication.
