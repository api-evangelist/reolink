      description: REST surface for cgi-bin-api.cgi?cmd=GetDdns&token={token}.
      operations:
      - method: POST
        name: getddns
        description: Get DDNS settings
        call: camera-network.getddns
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
